<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Aishwarya Srivastava · Business Operations Analyst · Data Analyst · Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d2e"/>
      <stop offset="0.55" stop-color="#123a4f"/>
      <stop offset="1" stop-color="#1b5e5a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a9d8f" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7ee0c9"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a9d8f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2a9d8f" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
      .fade1 { animation: up 0.9s ease-out 0.1s both; }
      .fade2 { animation: up 0.9s ease-out 0.5s both; }
      .fade3 { animation: up 0.9s ease-out 0.9s both; }
      .fade4 { animation: up 0.9s ease-out 1.3s both; }
      @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      .draw { stroke-dasharray: 900; stroke-dashoffset: 0; animation: draw 2.4s ease-out 0.3s both; }
      @keyframes draw { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
      .areaIn { animation: fadeIn 1.2s ease-out 1.8s both; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 0.8s ease-out both; }
      @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.6); } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- right-side data visual: bars + trend line -->
  <g transform="translate(838,72) scale(0.88)">
    <g fill="#ffffff" fill-opacity="0.10">
      <rect class="bar" style="animation-delay:.2s" x="0"   y="150" width="34" height="50" rx="4"/>
      <rect class="bar" style="animation-delay:.3s" x="48"  y="125" width="34" height="75" rx="4"/>
      <rect class="bar" style="animation-delay:.4s" x="96"  y="135" width="34" height="65" rx="4"/>
      <rect class="bar" style="animation-delay:.5s" x="144" y="95"  width="34" height="105" rx="4"/>
      <rect class="bar" style="animation-delay:.6s" x="192" y="105" width="34" height="95" rx="4"/>
      <rect class="bar" style="animation-delay:.7s" x="240" y="65"  width="34" height="135" rx="4"/>
      <rect class="bar" style="animation-delay:.8s" x="288" y="45"  width="34" height="155" rx="4"/>
      <rect class="bar" style="animation-delay:.9s" x="336" y="20"  width="34" height="180" rx="4"/>
    </g>
    <path class="areaIn" d="M17 140 L65 112 L113 120 L161 80 L209 88 L257 50 L305 34 L353 8 L353 200 L17 200 Z" fill="url(#area)"/>
    <path class="draw" d="M17 140 L65 112 L113 120 L161 80 L209 88 L257 50 L305 34 L353 8" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="pulse" cx="353" cy="8" r="6" fill="#7ee0c9"/>
    <!-- scatter dots -->
    <g fill="#e9c46a" fill-opacity="0.85">
      <circle class="pulse" style="animation-delay:.4s" cx="40"  cy="20" r="3"/>
      <circle class="pulse" style="animation-delay:1.1s" cx="120" cy="40" r="3"/>
      <circle class="pulse" style="animation-delay:1.7s" cx="200" cy="15" r="3"/>
    </g>
  </g>

  <!-- text -->
  <g class="t">
    <text class="fade1" x="60" y="92" fill="#7ee0c9" font-size="20" font-weight="600" letter-spacing="3">HI, I'M</text>
    <text class="fade2" x="58" y="150" fill="#ffffff" font-size="54" font-weight="700">Aishwarya Srivastava</text>
    <text class="fade3" x="60" y="192" fill="#d6e6ee" font-size="22">Business Operations Analyst · Data Analyst · Software Engineer</text>

    <g class="fade4" font-size="15" font-weight="600">
      <rect x="60"  y="222" width="236" height="36" rx="18" fill="#2a9d8f" fill-opacity="0.25" stroke="#2a9d8f"/>
      <circle cx="82" cy="240" r="5" fill="#7ee0c9"/>
      <text x="96" y="245" fill="#ffffff">M.S. Data Science · ASU</text>
      <rect x="308" y="222" width="262" height="36" rx="18" fill="#e9c46a" fill-opacity="0.18" stroke="#e9c46a"/>
      <circle cx="330" cy="240" r="5" fill="#e9c46a"/>
      <text x="344" y="245" fill="#ffffff">4+ yrs · Accenture &amp; DXC</text>
      <rect x="582" y="222" width="236" height="36" rx="18" fill="#e76f51" fill-opacity="0.2" stroke="#e76f51"/>
      <circle cx="604" cy="240" r="5" fill="#4ade80"/>
      <text x="618" y="245" fill="#ffffff">Open to full-time · US</text>
    </g>
  </g>
</svg>
