<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Career timeline: DXC Technology Software Engineer, Jul 2020 to Mar 2023; Accenture Packaged App Development Analyst, Apr 2023 to Dec 2024; Arizona State University M.S. Data Science and Analytics, Jan 2025 to Dec 2026; Rubrik Sales Engineer Intern, Jun to Aug 2026">
  <defs>
    <style>
      .t { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
      .track { stroke-dasharray: 1060; stroke-dashoffset: 0; animation: draw 1.6s ease-out both; }
      @keyframes draw { from { stroke-dashoffset: 1060; } to { stroke-dashoffset: 0; } }
      .node { animation: in 0.6s ease-out both; }
      @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="16" fill="#0b1d2e"/>
  <g class="t">
    <text x="60" y="50" fill="#ffffff" font-size="20" font-weight="700">Career journey</text>
    <text x="60" y="74" fill="#9fb7c4" font-size="14">Software engineering → automation &amp; analytics → data science → sales engineering</text>

    <line class="track" x1="70" y1="150" x2="1130" y2="150" stroke="#2f5568" stroke-width="4" stroke-linecap="round"/>

    <g class="node" style="animation-delay:.3s">
      <circle cx="160" cy="150" r="14" fill="#0b1d2e" stroke="#f4a261" stroke-width="4"/>
      <text x="160" y="118" text-anchor="middle" fill="#f4a261" font-size="14" font-weight="700">JUL 2020 – MAR 2023</text>
      <text x="160" y="195" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">DXC Technology</text>
      <text x="160" y="219" text-anchor="middle" fill="#d6e6ee" font-size="14">Software Engineer</text>
      <text x="160" y="244" text-anchor="middle" fill="#9fb7c4" font-size="12.5">Python/SQL pipelines · Kubernetes</text>
      <text x="160" y="262" text-anchor="middle" fill="#9fb7c4" font-size="12.5">Promoted within 1.8 years</text>
    </g>

    <g class="node" style="animation-delay:.7s">
      <circle cx="455" cy="150" r="14" fill="#0b1d2e" stroke="#e9c46a" stroke-width="4"/>
      <text x="455" y="118" text-anchor="middle" fill="#e9c46a" font-size="14" font-weight="700">APR 2023 – DEC 2024</text>
      <text x="455" y="195" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Accenture</text>
      <text x="455" y="219" text-anchor="middle" fill="#d6e6ee" font-size="14">Packaged App Development Analyst</text>
      <text x="455" y="244" text-anchor="middle" fill="#9fb7c4" font-size="12.5">Automation · SAP · SQL</text>
      <text x="455" y="262" text-anchor="middle" fill="#9fb7c4" font-size="12.5">$150K+ additional revenue</text>
    </g>

    <g class="node" style="animation-delay:1.1s">
      <circle cx="750" cy="150" r="14" fill="#0b1d2e" stroke="#7ee0c9" stroke-width="4"/>
      <text x="750" y="118" text-anchor="middle" fill="#7ee0c9" font-size="14" font-weight="700">JAN 2025 – DEC 2026</text>
      <text x="750" y="195" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Arizona State University</text>
      <text x="750" y="219" text-anchor="middle" fill="#d6e6ee" font-size="14">M.S. Data Science &amp; Analytics</text>
      <text x="750" y="244" text-anchor="middle" fill="#9fb7c4" font-size="12.5">4.00 GPA · Valley Fever capstone</text>
      <text x="750" y="262" text-anchor="middle" fill="#9fb7c4" font-size="12.5">Business Operations Analyst</text>
    </g>

    <g class="node" style="animation-delay:1.5s">
      <circle cx="1040" cy="150" r="16" fill="#e76f51"/>
      <circle cx="1040" cy="150" r="16" fill="none" stroke="#e76f51" stroke-width="3">
        <animate attributeName="r" values="16;26;16" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="1040" y="118" text-anchor="middle" fill="#e76f51" font-size="14" font-weight="700">JUN – AUG 2026</text>
      <text x="1040" y="195" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Rubrik</text>
      <text x="1040" y="219" text-anchor="middle" fill="#d6e6ee" font-size="14">Sales Engineer Intern</text>
      <text x="1040" y="244" text-anchor="middle" fill="#9fb7c4" font-size="12.5">7+ enterprise deployments</text>
      <text x="1040" y="262" text-anchor="middle" fill="#9fb7c4" font-size="12.5">15+ customer demos</text>
    </g>
  </g>
</svg>
